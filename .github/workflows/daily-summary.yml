name: daily-summary

# Daily scan of curated YouTube playlists → summarize new videos → publish to
# Discord + Telegram → stage a manual bundle → commit dedup state back to the repo.
# Can also be triggered manually from the Actions tab (no URL = scheduled scan).
#
# NOTE: pipeline code lives in bersama-ai-pipeline/, so this job runs there.
# GitHub only reads workflows from the repo root .github/workflows/.

on:
  schedule:
    - cron: "3 1 * * *"   # 01:03 UTC ≈ 09:03 MYT
  workflow_dispatch:       # manual run from the Actions UI

permissions:
  contents: write          # the run commits state/processed.json + content/ back

concurrency:
  group: pipeline-state    # serialize runs that touch the shared state file
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: bersama-ai-pipeline
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1            # shallow — we only need HEAD + the state file

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: bersama-ai-pipeline/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -U yt-dlp   # always-latest extractor on run day

      - name: Run scheduled scan
        env:
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          ZAI_BASE_URL: ${{ vars.ZAI_BASE_URL || 'https://api.z.ai/api/coding/paas/v4/' }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TELEGRAM_DM_CHAT_ID: ${{ secrets.TELEGRAM_DM_CHAT_ID }}
          GLM_MODEL: ${{ vars.GLM_MODEL || 'glm-5.2' }}
          MAX_DURATION_MIN: ${{ vars.MAX_DURATION_MIN || '60' }}
        run: python -m pipeline.main --mode scheduled

      - name: Commit state + bundles
        if: always()                   # commit even if a video failed, so dedup stays correct
        run: |
          git config user.email "actions@github.com"
          git config user.name "bersama-ai-bot"
          git add state/processed.json content/ 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "chore: pipeline run $(date -u +%FT%TZ)"
          # Fetch some ancestry for a clean rebase (checkout used fetch-depth: 1).
          git fetch --depth=50 origin "$GITHUB_REF_NAME"
          if ! git pull --rebase origin "$GITHUB_REF_NAME"; then
            echo "::warning::rebase conflict — aborting so we never push a conflicted state file"
            git rebase --abort || true
          fi
          if ! git push; then
            echo "::warning::PUSH_FAILED — dedup state may not have persisted; next run may reprocess some videos"
          fi
