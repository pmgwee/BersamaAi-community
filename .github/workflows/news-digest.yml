name: news-digest

# Trending AI news → #subscription-value. Polls Reddit AI subs + Hacker News
# every ~3h, an LLM judge picks the few items worth posting, dedupes, and posts.
# Also runnable manually from the Actions tab.
#
# NOTE: pipeline code lives in bersama-ai-pipeline/, so this job runs there.

on:
  schedule:
    - cron: "17 */3 * * *"   # every 3h at :17 (03:17, 06:17, 09:17, … UTC)
  workflow_dispatch:

permissions:
  contents: write   # the run commits state/news_seen.json back

concurrency:
  group: pipeline-state
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: bersama-ai-pipeline
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: bersama-ai-pipeline/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Sweep engagement
        # Read-only REST sweep of reactions on posted news cards (needs the bot
        # token). Exits 0 if DISCORD_TOKEN is unset, so this never fails the run.
        # ⚠️ Only add the DISCORD_TOKEN secret if this repo is PRIVATE — a public
        # repo leak = full bot admin. See ENGAGEMENT-LOOP-PLAN security note.
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
        run: python -m pipeline.engagement

      - name: Compute preferences
        # Pure compute: engagement.jsonl + posted_log.jsonl → preferences.json.
        # No network. PREFS_ENABLED gates whether the actuator engages (default false).
        env:
          PREFS_ENABLED: ${{ secrets.PREFS_ENABLED }}
        run: python -m pipeline.preferences

      - name: Run news digest
        env:
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          ZAI_BASE_URL: ${{ vars.ZAI_BASE_URL || 'https://api.z.ai/api/coding/paas/v4/' }}
          DISCORD_NEWS_WEBHOOK_URL: ${{ secrets.DISCORD_NEWS_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_DM_CHAT_ID: ${{ secrets.TELEGRAM_DM_CHAT_ID }}
          GLM_MODEL: ${{ vars.GLM_MODEL || 'glm-5.2' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # authenticated GitHub search -> no rate limit
          DISCORD_IMAGE_CREATION_WEBHOOK_URL: ${{ secrets.DISCORD_IMAGE_CREATION_WEBHOOK_URL }}
          DISCORD_VIDEO_CREATION_WEBHOOK_URL: ${{ secrets.DISCORD_VIDEO_CREATION_WEBHOOK_URL }}
          DISCORD_VOICE_STUDIO_WEBHOOK_URL: ${{ secrets.DISCORD_VOICE_STUDIO_WEBHOOK_URL }}
          DISCORD_EDUCATION_WEBHOOK_URL: ${{ secrets.DISCORD_EDUCATION_WEBHOOK_URL }}
          DISCORD_FINANCE_WEBHOOK_URL: ${{ secrets.DISCORD_FINANCE_WEBHOOK_URL }}   # #earn-money-with-ai (finance topic)
          DISCORD_STAFF_CHAT_WEBHOOK_URL: ${{ secrets.DISCORD_STAFF_CHAT_WEBHOOK_URL }}   # 0-posted health warnings
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}         # optional: OAuth JSON (real upvote counts);
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }} # unset -> public RSS fallback (works, no scores)
          PREFS_ENABLED: ${{ secrets.PREFS_ENABLED }}   # engagement actuator on/off (unset/false = dormant)
        run: python -m pipeline.main --mode news

      - name: Commit news dedup state
        if: always()
        run: |
          git config user.email "actions@github.com"
          git config user.name "bersama-ai-bot"
          git add state/news_seen.json state/github_stars.json \
                state/posted_log.jsonl state/engagement.jsonl \
                state/preferences.json state/activity_baseline.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "chore: news digest $(date -u +%FT%TZ)"
          git fetch --depth=50 origin "$GITHUB_REF_NAME"
          if ! git pull --rebase origin "$GITHUB_REF_NAME"; then
            echo "::warning::rebase conflict — aborting so we never push a conflicted state file"
            git rebase --abort || true
          fi
          if ! git push; then
            echo "::warning::PUSH_FAILED — news dedup state may not have persisted; next run may repost some items"
          fi
