name: stock-digest

# Daily X/Twitter digest → #stock-invest. Pulls each subscribed account's latest
# posts from Nitter RSS once a day, dedupes against state/x_seen_<screen>.json,
# and posts each new tweet as a verbatim card. No LLM (the tweet text IS the
# card), so this job needs no ZAI_* key. Also runnable manually from the Actions
# tab — trigger it once after setting DISCORD_STOCK_INVEST_WEBHOOK_URL to verify.
#
# NOTE: pipeline code lives in bersama-ai-pipeline/, so this job runs there.

on:
  schedule:
    - cron: "43 7 * * *"   # daily at 07:43 UTC (~15:43 MYT); off-peak minute
  workflow_dispatch:

permissions:
  contents: write   # the run commits state/x_seen_*.json back

# Shares the news-digest group so this job's state commit and the news run's
# state commit never race (they write different files, but the rebase-push can).
concurrency:
  group: pipeline-state
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: bersama-ai-pipeline
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: bersama-ai-pipeline/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run X digest
        # No ZAI_* here — cards are the tweets verbatim, no LLM. The run alerts
        # #staff-chat (DISCORD_STAFF_CHAT_WEBHOOK_URL) if every Nitter instance
        # is down, so silent breakage is visible.
        env:
          DISCORD_STOCK_INVEST_WEBHOOK_URL: ${{ secrets.DISCORD_STOCK_INVEST_WEBHOOK_URL }}   # #stock-invest (@EconomyApp)
          DISCORD_STAFF_CHAT_WEBHOOK_URL: ${{ secrets.DISCORD_STAFF_CHAT_WEBHOOK_URL }}       # health warnings when all Nitter instances fail
        run: python -m pipeline.main --mode x-digest

      - name: Commit X dedup state
        if: always()
        run: |
          git config user.email "actions@github.com"
          git config user.name "bersama-ai-bot"
          git add state/x_seen_*.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "chore: stock digest $(date -u +%FT%TZ)"
          git fetch --depth=50 origin "$GITHUB_REF_NAME"
          if ! git pull --rebase origin "$GITHUB_REF_NAME"; then
            echo "::warning::rebase conflict — aborting so we never push a conflicted state file"
            git rebase --abort || true
          fi
          if ! git push; then
            echo "::warning::PUSH_FAILED — X dedup state may not have persisted; next run may repost some items"
          fi
